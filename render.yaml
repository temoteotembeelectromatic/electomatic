services:
  - type: web
    name: electomatic
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: electomatic-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PREFIX
        value: electomatic/
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
databases:
  - name: electomatic-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: electomatic
    user: electomatic
    postgresMajorVersion: "17"
    diskSizeGB: 5
    ipAllowList: []
